name: AmneziaWG Universal checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source
        run: |
          cd apps/amneziawg-universal
          node --check src/manager.js
          node --check src/portal.js
          for f in src/*.sh; do sh -n "$f"; done
          python tests/test_profile.py
